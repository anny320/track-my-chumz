<script>
const K = n => {

const pct = (a,b) => b>0 ? Math.min((a/b)*100,100) : 0;

const $ = s => document.querySelector(s);

const curMonth = now.toISOString().slice(0,7);
const monthLabel = now.toLocaleDateString('en-KE',{month:'long',year:'numeric'});
const dayNum = now.getDate();
const daysIn = new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
const daysLeft = daysIn - dayNum;

function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// GA4 event tracking
function track(event,params){
  try{if(typeof gtag==='function')gtag('event',event,params||{});}catch(e){}
}

// Profile / personalisation
function saveProfile(p){
  if(_pin){
    secureSet('ba4-profile', p);
  } else {
    localStorage.setItem('ba4-profile',JSON.stringify(p));
  }
}

function loadProfile(){
  // Sync load — can't decrypt async here, so try JSON first
  try{const p=localStorage.getItem('ba4-profile');if(p){try{return JSON.parse(p);}catch(e){return {};}}return{};}catch(e){return{};}
}

async function loadProfileAsync(){
  if(_pin){
    const p = await secureGet('ba4-profile');
    return p || {};
  }
  return loadProfile();
}

window.removePin = async function(){
  if(!confirm('Remove PIN protection? Your data will be stored unencrypted.')) return;
  // Decrypt everything and store as plain JSON
  const d = await secureGet('ba4');
  if(d) localStorage.setItem('ba4', JSON.stringify(d));
  const h = await secureGet('ba4-history');
  if(h) localStorage.setItem('ba4-history', JSON.stringify(h));
  const p = await secureGet('ba4-profile');
  if(p) localStorage.setItem('ba4-profile', JSON.stringify(p));
  localStorage.removeItem('ba4-pin');
  _pin = null;
  toast('PIN removed — data is no longer encrypted');
  render();
};
function getGreeting(){
  const p=loadProfile();
  const h=now.getHours();
  const name=p.name?`, ${p.name}`:'';
  if(h<12) return `Good morning${name} ☀️`;
  if(h<17) return `Good afternoon${name} 👋`;
  return `Good evening${name} 🌙`;
}

// ═══════════════════════════════════════
// ENCRYPTION (AES-256-GCM + PBKDF2)
// ═══════════════════════════════════════
async function deriveKey(pin, salt){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:310000, hash:'SHA-256'},
    keyMaterial,
    {name:'AES-GCM', length:256},
    false,
    ['encrypt','decrypt']
  );
}

async function encryptData(plaintext, pin){
  const enc = new TextEncoder();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pin, salt);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(plaintext));
  // Pack: salt(16) + iv(12) + ciphertext
  const buf = new Uint8Array(salt.length + iv.length + new Uint8Array(ct).length);
  buf.set(salt, 0);
  buf.set(iv, 16);
  buf.set(new Uint8Array(ct), 28);
  return btoa(String.fromCharCode(...buf));
}

async function decryptData(b64, pin){
  const raw = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
  const salt = raw.slice(0, 16);
  const iv = raw.slice(16, 28);
  const ct = raw.slice(28);
  const key = await deriveKey(pin, salt);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return new TextDecoder().decode(pt);
}

async function hashPin(pin){
  const enc = new TextEncoder();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations:310000, hash:'SHA-256'}, keyMaterial, 256);
  const hashArr = new Uint8Array(bits);
  const packed = new Uint8Array(salt.length + hashArr.length);
  packed.set(salt, 0);
  packed.set(hashArr, 16);
  return btoa(String.fromCharCode(...packed));
}

async function verifyPin(pin, stored){
  const raw = Uint8Array.from(atob(stored), c=>c.charCodeAt(0));
  const salt = raw.slice(0, 16);
  const storedHash = raw.slice(16);
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations:310000, hash:'SHA-256'}, keyMaterial, 256);
  const testHash = new Uint8Array(bits);
  if(testHash.length !== storedHash.length) return false;
  let match = true;
  for(let i=0; i<testHash.length; i++) if(testHash[i]!==storedHash[i]) match=false;
  return match;
}

// Encrypted storage wrappers
let _pin = null; // held in memory only during session

async function secureGet(key){
  const raw = localStorage.getItem(key);
  if(!raw) return null;
  if(!_pin) return null;
  try{
    // Try decrypting — if it fails, data might be unencrypted (migration)
    const plain = await decryptData(raw, _pin);
    return JSON.parse(plain);
  }catch(e){
    // Might be old unencrypted data
    try{ return JSON.parse(raw); }catch(e2){ return null; }
  }
}

async function secureSet(key, obj){
  if(!_pin){
    localStorage.setItem(key, JSON.stringify(obj));
    return;
  }
  const ct = await encryptData(JSON.stringify(obj), _pin);
  localStorage.setItem(key, ct);
}

// PIN state
function hasPinSet(){ return !!localStorage.getItem('ba4-pin'); }

let lockScreenEl = null;
let pinBuffer = '';
let pinMode = 'unlock'; // 'unlock', 'setup', 'confirm-new', 'change-verify', 'change-new', 'change-confirm'
let pinSetupFirst = '';

function showLockScreen(mode){
  pinMode = mode;
  pinBuffer = '';
  const titles = {
    'setup': 'Create a PIN',
    'confirm-new': 'Confirm your PIN',
    'unlock': 'Enter your PIN',
    'change-verify': 'Enter current PIN',
    'change-new': 'Enter new PIN',
    'change-confirm': 'Confirm new PIN',
  };
  const subs = {
    'setup': 'Choose a 4-digit PIN to protect your budget data',
    'confirm-new': 'Enter the same PIN again to confirm',
    'unlock': 'Your data is encrypted and PIN-protected',
    'change-verify': 'Verify your identity first',
    'change-new': 'Choose a new 4-digit PIN',
    'change-confirm': 'Confirm your new PIN',
  };

  if(lockScreenEl) lockScreenEl.remove();
  lockScreenEl = document.createElement('div');
  lockScreenEl.className = 'lock-screen';
  lockScreenEl.innerHTML = `
    <div class="lock-box">
      <div class="lock-icon">🔐</div>
      <h2>${titles[mode]}</h2>
      <div class="lock-sub">${subs[mode]}</div>
      <div class="pin-dots">${[0,1,2,3].map(i=>`<div class="pin-dot" id="pd${i}"></div>`).join('')}</div>
      <div class="pin-pad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="pin-key" onclick="pinPress('${n}')">${n}</button>`).join('')}
        <button class="pin-key fn" onclick="pinPress('clear')">Clear</button>
        <button class="pin-key" onclick="pinPress('0')">0</button>
        <button class="pin-key fn" onclick="pinPress('back')">⌫</button>
      </div>
      ${mode==='unlock'?`<div class="lock-forgot">
        <div style="margin-bottom:6px">Forgot your PIN?</div>
        <a onclick="confirmPinReset()">Reset PIN & delete all data</a>
        <div style="margin-top:6px;font-size:11px;color:#4B5563">Because your data is encrypted, there is no way to recover it without the PIN.</div>
      </div>`:''}
      ${mode==='setup'?`<div class="lock-forgot">
        <div style="font-size:11px;color:#F5A623;margin-top:4px">⚠️ Remember this PIN — if you forget it, your encrypted data cannot be recovered. You would need to reset and start over.</div>
      </div>`:''}
    </div>
  `;
  document.body.appendChild(lockScreenEl);
}

function updateDots(error){
  for(let i=0;i<4;i++){
    const d=document.getElementById('pd'+i);
    if(!d) continue;
    d.className='pin-dot'+(i<pinBuffer.length?' filled':'')+(error?' error':'');
  }
}

window.pinPress = async function(key){
  if(key==='clear'){ pinBuffer=''; updateDots(); return; }
  if(key==='back'){ pinBuffer=pinBuffer.slice(0,-1); updateDots(); return; }
  if(pinBuffer.length>=4) return;
  pinBuffer+=key;
  updateDots();

  if(pinBuffer.length===4){
    await handlePinComplete(pinBuffer);
  }
};

async function handlePinComplete(pin){
  if(pinMode==='setup'){
    pinSetupFirst = pin;
    setTimeout(()=>showLockScreen('confirm-new'), 300);
    return;
  }

  if(pinMode==='confirm-new'){
    if(pin !== pinSetupFirst){
      updateDots(true);
      setTimeout(()=>{ toast("PINs don't match — try again"); showLockScreen('setup'); }, 600);
      return;
    }
    // Save PIN hash and encrypt existing data
    const h = await hashPin(pin);
    localStorage.setItem('ba4-pin', h);
    _pin = pin;
    // Re-encrypt existing data
    await secureSet('ba4', data);
    const hist = getHistory();
    if(hist.length) await secureSet('ba4-history', hist);
    const profile = loadProfile();
    if(Object.keys(profile).length) await secureSet('ba4-profile', profile);
    lockScreenEl.remove();
    lockScreenEl=null;
    toast('PIN set — your data is now encrypted');
    track('pin_created');
    render();
    return;
  }

  if(pinMode==='unlock'){
    const stored = localStorage.getItem('ba4-pin');
    const ok = await verifyPin(pin, stored);
    if(!ok){
      updateDots(true);
      setTimeout(()=>{ pinBuffer=''; updateDots(); }, 600);
      return;
    }
    _pin = pin;
    lockScreenEl.remove();
    lockScreenEl=null;
    await loadEncrypted();
    render();
    // Show welcome banner if needed
    showWelcomeBanner();
    return;
  }

  if(pinMode==='change-verify'){
    const stored = localStorage.getItem('ba4-pin');
    const ok = await verifyPin(pin, stored);
    if(!ok){
      updateDots(true);
      setTimeout(()=>{ pinBuffer=''; updateDots(); toast('Incorrect PIN'); }, 600);
      return;
    }
    setTimeout(()=>showLockScreen('change-new'), 300);
    return;
  }

  if(pinMode==='change-new'){
    pinSetupFirst = pin;
    setTimeout(()=>showLockScreen('change-confirm'), 300);
    return;
  }

  if(pinMode==='change-confirm'){
    if(pin !== pinSetupFirst){
      updateDots(true);
      setTimeout(()=>{ toast("PINs don't match"); showLockScreen('change-new'); }, 600);
      return;
    }
    const h = await hashPin(pin);
    localStorage.setItem('ba4-pin', h);
    _pin = pin;
    await secureSet('ba4', data);
    const hist = getHistory();
    if(hist.length) await secureSet('ba4-history', hist);
    const profile = loadProfile();
    if(Object.keys(profile).length) await secureSet('ba4-profile', profile);
    lockScreenEl.remove();
    lockScreenEl=null;
    toast('PIN changed successfully');
    track('pin_changed');
    render();
    return;
  }
}

// PARSER — handles natural budget text
// ═══════════════════════════════════════
function parseBudgetText(raw){
  const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  let income=0, balance=null, items=[];

  for(const line of lines){
    const lo = line.toLowerCase();

    // Skip totals/section headers
    if(lo.match(/^total[\s=]/) || lo==='expenses' || lo==='budget' || lo.match(/^\d[\d\s\+\=\,\.]+$/)) continue;

    // Balance
    if(lo.match(/balance|opening|b\/f|brought forward/)){
      const n = extractNum(line);
      if(n!==null){
        // preserve negative if the original line had a negative indicator
        balance = lo.includes('-') || line.includes('-') ? -Math.abs(n) : n;
        // Check more carefully: if the negative sign is right before the number
        const negMatch = line.match(/-\s*[\d,]+/);
        if(negMatch) balance = -Math.abs(n);
        else balance = n;
      }
      continue;
    }

    // Income
    if(lo.match(/income|salary|earnings|pay\b|wages|received/)){
      const n = extractNum(line);
      if(n!==null && n>0) income = n;
      continue;
    }

    // Expense line
    const n = extractNum(line);
    if(n!==null && n!==0){
      items.push({
        id: uid(),
        name: cleanName(line),
        amount: Math.abs(n),
        status: getPayStatus(line),
        original: line
      });
    }
  }

  return {income, balance, items};
}

function extractNum(line){
  // "14k" / "14K"
  const km = line.match(/([\d,.]+)\s*k\b/i);
  if(km) return parseFloat(km[1].replace(/,/g,''))*1000;

  // find all numbers
  const nums=[];
  const re = /-?\s*[\d,]+(?:\.\d+)?/g;
  let m;
  while((m=re.exec(line))!==null){
    const v = parseFloat(m[0].replace(/[\s,]/g,''));
    if(!isNaN(v) && v!==0) nums.push(v);
  }
  if(!nums.length) return null;
  // largest absolute value is the amount
  nums.sort((a,b)=>Math.abs(b)-Math.abs(a));
  return nums[0];
}

function getPayStatus(line){
  const l=line.toLowerCase();
  if(l.includes('?')||l.includes('maybe')||l.includes('tbd')) return 'maybe';
  if(l.match(/\bpaid\b|\bpd\b|\bdone\b|\bsent\b|\bcleared\b|\bdeducted\b/)) return 'paid';
  return 'unpaid';
}

function cleanName(line){
  return line
    .replace(/-?\s*[\d,]+(?:\.\d+)?\s*k?\b/gi,'')
    .replace(/\b(paid|pd|done|sent|cleared|deducted|kes|ksh|tbd|maybe)\b/gi,'')
    .replace(/[?]/g,'')
    .replace(/^\s*[-–—:]\s*/,'')
    .replace(/\s*[-–—:]\s*$/,'')
    .replace(/\s+/g,' ')
    .replace(/^[-–—.\s]+|[-–—.\s]+$/g,'')
    .trim() || 'Unnamed item';
}

let view = 'input';

function load(){
  // Unencrypted load — used when no PIN or during initial setup
  try{

      } else if(data) {

      }
    }
  }catch(e){}

  if(!data.history) data.history=[];if(!data.incomeSources) data.incomeSources=[];if(!data.investments) data.investments=[];
}

function archiveMonth(d){
  let hist=[];
  try{ const h=localStorage.getItem('ba4-history'); if(h){ try{hist=JSON.parse(h);}catch(e){/* encrypted, handle later */} } }catch(e){}
  const t=d.items.reduce((s,i)=>s+i.amount,0);
  const paidFull=d.items.filter(i=>i.status==='paid').reduce((s,i)=>s+i.amount,0);
  const partialPaid=d.items.filter(i=>i.status==='partial').reduce((s,i)=>s+(i.paidAmount||0),0);
  const paid=paidFull+partialPaid;
  const srcs=d.incomeSources||[];
  const incReceived=srcs.filter(s=>s.status==='received').reduce((s,i)=>s+i.amount,0)
    +srcs.filter(s=>s.status==='partial').reduce((s,i)=>s+(i.receivedAmount||0),0);
  const incPending=srcs.filter(s=>s.status==='pending').reduce((s,i)=>s+i.amount,0)
    +srcs.filter(s=>s.status==='partial').reduce((s,i)=>s+(i.amount-(i.receivedAmount||0)),0);
  const effectiveIncome=srcs.length>0?incReceived+incPending:d.income;

  hist.push({
    month:d.month,
    income:effectiveIncome,
    incomeReceived:incReceived,
    incomePending:incPending,
    balance:d.balance,
    totalExpenses:t,
    totalPaid:paid,
    remaining:effectiveIncome-t,
    itemCount:d.items.length,
    items:d.items.map(i=>({name:i.name,amount:i.amount,status:i.status,paidAmount:i.paidAmount||null})),
    incomeSources:srcs.map(s=>({name:s.name,description:s.description||'',amount:s.amount,status:s.status,receivedAmount:s.receivedAmount||0})),
    investments:(d.investments||[]).map(i=>({name:i.name,note:i.note||'',amount:i.amount,type:i.type,date:i.date||''})),
    totalInvested:(d.investments||[]).reduce((s,i)=>s+i.amount,0),
    archivedAt:new Date().toISOString()
  });
  if(hist.length>12) hist=hist.slice(-12);
  setHistory(hist);
}

// History cache to avoid read-after-write issues
let _historyCache=null;

function getHistory(){
  if(_historyCache) return _historyCache;
  try{
    const h=localStorage.getItem('ba4-history');
    if(!h) return [];
    try{
      const parsed=JSON.parse(h);
      _historyCache=parsed;
      return parsed;
    }catch(e){
      if(_pin) return [];
      return [];
    }
  }catch(e){return[];}
}

function setHistory(hist){
  _historyCache=hist;
  if(_pin){
    secureSet('ba4-history',hist);
  } else {
    localStorage.setItem('ba4-history',JSON.stringify(hist));
  }
}

function clearHistoryCache(){_historyCache=null;}

function monthLabel2(m){

function getSuffix(d){
  d=Number(d);if(!d)return'';
  if(d>=11&&d<=13)return'th';
  const s=['th','st','nd','rd'];return(s[d%10]||s[0]);
}

function save(){
  // Rolling backup — keeps last saved state for recovery
  const current=localStorage.getItem('ba4');
  if(current) localStorage.setItem('ba4-backup',current);

  if(_pin){
    secureSet('ba4', data);
  } else {
    localStorage.setItem('ba4',JSON.stringify(data));
  }
}

function totals(){
  const all=data.items.reduce((s,i)=>s+i.amount,0);
  const paidFull=data.items.filter(i=>i.status==='paid').reduce((s,i)=>s+i.amount,0);
  const partialPaid=data.items.filter(i=>i.status==='partial').reduce((s,i)=>s+(i.paidAmount||0),0);
  const paid=paidFull+partialPaid;
  const partialOwed=data.items.filter(i=>i.status==='partial').reduce((s,i)=>s+(i.amount-(i.paidAmount||0)),0);
  const unpaid=data.items.filter(i=>i.status==='unpaid').reduce((s,i)=>s+i.amount,0);
  const maybe=data.items.filter(i=>i.status==='maybe').reduce((s,i)=>s+i.amount,0);
  // Income from sources
  const srcs=data.incomeSources||[];
  const incReceived=srcs.filter(s=>s.status==='received').reduce((s,i)=>s+i.amount,0);
  const incPartialRcvd=srcs.filter(s=>s.status==='partial').reduce((s,i)=>s+(i.receivedAmount||0),0);
  const incPending=srcs.filter(s=>s.status==='pending').reduce((s,i)=>s+i.amount,0);
  const incPartialOwed=srcs.filter(s=>s.status==='partial').reduce((s,i)=>s+(i.amount-(i.receivedAmount||0)),0);
  const incInHand=incReceived+incPartialRcvd;
  const incPendingTotal=incPending+incPartialOwed;
  const incTotal=incInHand+incPendingTotal;
  // Use sources total if sources exist, otherwise fall back to flat income
  const effectiveIncome=srcs.length>0?incTotal:data.income;
  return {all,paid,unpaid,maybe,partialOwed,
    remaining:effectiveIncome-all,
    stillDue:unpaid+maybe+partialOwed,
    actuallyOwed:unpaid+partialOwed,
    incReceived:incInHand,incExpected:incPendingTotal,incTotal:effectiveIncome};
}


// ═══════════════════════════════════════
// ANALYSIS ENGINE — rule-based
// ═══════════════════════════════════════
function analyze(){
  const t=totals(), f=[];

  if(t.all>data.income&&data.income>0){
    f.push({icon:'🚨',title:'Expenses exceed income',type:'warn',
      body:`Expenses total ${K(t.all)} against ${K(data.income)} income — a ${K(t.all-data.income)} shortfall. Something has to be cut or you're borrowing from next month.`});
  } else if(t.remaining>0&&t.remaining<data.income*.1&&data.income>0){
    f.push({icon:'⚠️',title:'Razor-thin margin',type:'warn',
      body:`Only ${K(t.remaining)} left (${Math.round((t.remaining/data.income)*100)}% of income). Any surprise expense puts you in the red.`});
  } else if(t.remaining>0&&data.income>0){
    f.push({icon:'✅',title:`${K(t.remaining)} remaining`,type:'ok',
      body:`That's ${Math.round((t.remaining/data.income)*100)}% of income. Allocate it — savings, emergency fund, or a goal. Unallocated money disappears.`});
  }

  if(data.balance!==null&&data.balance<0){
    f.push({icon:'🔴',title:`Negative opening balance: ${K(data.balance)}`,type:'warn',
      body:`You're starting in the red. Address the deficit before budgeting anything discretionary.`});
  }
  if(data.balance!==null&&data.balance>0&&t.stillDue>data.balance){
    f.push({icon:'⚠️',title:'Balance won\'t cover remaining bills',type:'warn',
      body:`${K(data.balance)} in account but ${K(t.stillDue)} still due — short by ${K(t.stillDue-data.balance)}. Prioritize: rent, utilities, food first.`});
  }

  if(t.unpaid>0){
    const ui=data.items.filter(i=>i.status==='unpaid');
    f.push({icon:'📋',title:`${ui.length} items still unpaid — ${K(t.unpaid)}`,type:'info',
      body:`Outstanding: ${ui.map(i=>`${i.name} (${K(i.amount)})`).join(', ')}. Set calendar reminders so none slip.`});
  }

  const partials=data.items.filter(i=>i.status==='partial');
  if(partials.length>0){
    const partialOwed=partials.reduce((s,i)=>s+(i.amount-(i.paidAmount||0)),0);
    f.push({icon:'◐',title:`${partials.length} partially paid — ${K(partialOwed)} still owed`,type:'tip',
      body:`${partials.map(i=>`${i.name}: ${K(i.paidAmount||0)} of ${K(i.amount)} paid`).join(' · ')}. Clear these balances before they carry over to next month.`});
  }

  if(t.maybe>0){
    const mi=data.items.filter(i=>i.status==='maybe');
    f.push({icon:'❓',title:`${mi.length} uncertain expenses — ${K(t.maybe)}`,type:'tip',
      body:`${mi.map(i=>i.name).join(', ')} — decide now. Cut them or commit and mark unpaid.`});
  }

  if(daysLeft>0&&data.income>0){
    const disc=Math.max(0,data.income-t.all);
    const daily=Math.round(disc/daysLeft);
    if(disc>0){
      f.push({icon:'📅',title:`Daily discretionary limit: ${K(daily)}`,type:'info',
        body:`${daysLeft} days left, ${K(disc)} unallocated. Max ${K(daily)}/day on non-budgeted items.`});
    } else {
      f.push({icon:'🛑',title:'Zero room for unplanned spending',type:'warn',
        body:`Every shilling is spoken for. Lock your M-Pesa float to weekly essentials.`});
    }
  }

  const big=data.items.filter(i=>data.income>0&&(i.amount/data.income)>.2);
  if(big.length>0){
    f.push({icon:'📊',title:'Large line items (>20% of income)',type:'tip',
      body:`${big.map(i=>`${i.name} = ${Math.round((i.amount/data.income)*100)}%`).join(', ')}. These deserve scrutiny — are they optimized?`});
  }

  const savKw=/sav|sacco|shares|invest|chama|pension|nssf|lock|mali/i;
  const savItems=data.items.filter(i=>savKw.test(i.name));
  if(savItems.length>0){
    const savT=savItems.reduce((s,i)=>s+i.amount,0);
    const savP=data.income>0?Math.round((savT/data.income)*100):0;
    if(savP>=20) f.push({icon:'🎯',title:`Saving ${savP}% of income — strong`,type:'ok',
      body:`${savItems.map(i=>i.name).join(', ')} = ${K(savT)}. Make sure these are locked or auto-deducted so they're not reversible.`});
    else if(savP>0) f.push({icon:'💰',title:`Saving ${savP}% — aim for 20%+`,type:'tip',
      body:`${K(savT)} to savings. Target: ${K(data.income*.2)} (20%). Gap: ${K(data.income*.2-savT)}. Top up via M-Pesa Lock Savings.`});
  } else if(data.income>0){
    f.push({icon:'⚠️',title:'No visible savings line',type:'warn',
      body:`No savings, SACCO, chama, or investment detected. If you're saving elsewhere, add it. If not — fix this first. Start with M-Pesa Lock.`});
  }

  // Expense concentration
  if(data.items.length>=5){
    const sorted=[...data.items].sort((a,b)=>b.amount-a.amount);
    const top3=sorted.slice(0,3).reduce((s,i)=>s+i.amount,0);
    const top3pct=Math.round((top3/t.all)*100);
    if(top3pct>75){
      f.push({icon:'🔎',title:`Top 3 items = ${top3pct}% of all expenses`,type:'tip',
        body:`${sorted.slice(0,3).map(i=>i.name).join(', ')} dominate your budget. Small savings here have outsized impact.`});
    }
  }

  // Hidden costs from profile
  const prof=loadProfile();
  if(prof.myLeaks&&prof.myLeaks.length>0){
    const myTotal=prof.myLeaks.reduce((s,id)=>{const leak=LEAKS.find(l=>l.id===id);return s+(leak?leak.mo:0);},0);
    if(myTotal>0){
      f.push({icon:'👻',title:`Hidden costs you identified: ~${K(myTotal)}/month`,type:'tip',
        body:`You flagged ${prof.myLeaks.length} phantom expense${prof.myLeaks.length>1?'s':''} in your Check-Up. That's up to ${K(myTotal*12)}/year on top of your budget. Even cutting half saves ${K(Math.round(myTotal/2))}/month.`});
    }
  } else {
    f.push({icon:'🔍',title:'Run your Hidden Cost Check-Up',type:'info',
      body:`Go to the Check-Up tab and identify which small recurring costs apply to you. Most people have 3-5 that add up to thousands per month.`});
  }

  return f;
}

function calUrl(item,dateStr){
  const d=dateStr||nextPayday();
  const s=d.replace(/-/g,'')+'T090000', e=d.replace(/-/g,'')+'T093000';
  const title=encodeURIComponent(`💰 Pay: ${item.name} — ${K(item.amount)}`);

}

function exportCSV(){

  c+=`INCOME\nSource,Amount (${cur}),Status,Received,Pending,Description\n`;

    srcs.forEach(s=>{
      const rcv=s.status==='received'?s.amount:s.status==='partial'?(s.receivedAmount||0):0;
      const pnd=s.status==='pending'?s.amount:s.status==='partial'?(s.amount-(s.receivedAmount||0)):0;

    });

  } else {
    c+=`Total Income,${data.income},received,${data.income},0,—\n`;
  }

  // Expenses
  c+=`\nEXPENSES\nItem,Amount (${cur}),Status,Paid Amount,Still Owed\n`;
  data.items.forEach(i=>{
    const pa=i.status==='paid'?i.amount:i.status==='partial'?(i.paidAmount||0):0;
    const ow=i.amount-pa;
    c+=`"${i.name.replace(/"/g,'""')}",${i.amount},${i.status},${pa},${ow}\n`;

  // Summary

    });
    c+=`Total Invested,${invTotal}\n`;

  const blob=new Blob([c],{type:'text/csv'});

// RENDER
// ═══════════════════════════════════════
function render(){
  const t=data.items.length>0?totals():null;
  const hist=getHistory();
  const tabs=[
    {id:'input',label:'Budget Input',icon:'✏️'},
    {id:'overview',label:'Overview',icon:'📊'},
    {id:'income',label:'Income',icon:'💵'},
    {id:'analysis',label:'Analysis',icon:'🧠'},
    {id:'calendar',label:'Reminders',icon:'📅'},
    {id:'export',label:'Export',icon:'📤'},
    {id:'hidden',label:'Check-Up',icon:'🔍'},
    {id:'mpesa',label:'M-Pesa Lock',icon:'🔒'},
    {id:'history',label:'History',icon:'📁'},
    {id:'settings',label:'Settings',icon:'⚙️'},
  ];

  let h='';

  // HEADER
  const profile=loadProfile();
  h+=`<div class="hdr">
    <div class="hdr-row"><div class="hdr-tag">Track my Chumz 💰</div><div style="font-size:11px;color:#9CA3AF">Day ${dayNum}/${daysIn}</div></div>
    <div class="hdr-month">${getGreeting()}</div>
    <div style="font-size:13px;color:#9CA3AF;margin-top:2px">${monthLabel}${profile.payday?' · Payday: '+profile.payday+getSuffix(profile.payday):''}</div>`;
  const effectiveIncome=t?t.incTotal:data.income;
  if(t&&effectiveIncome>0){
    h+=`<div class="hdr-stats">
      <div><span class="lb">Income</span> <span class="vl">${K(effectiveIncome)}</span></div>
      <div><span class="lb">Expenses</span> <span class="vl ${t.all>effectiveIncome?'neg':'pos'}">${K(t.all)}</span></div>
      <div><span class="lb">Left</span> <span class="vl ${t.remaining<0?'neg':'pos'}">${K(t.remaining)}</span></div>
    </div>
    <div class="prog-track"><div class="prog-fill" style="width:${pct(t.all,effectiveIncome)}%;background:${t.all>effectiveIncome?'#EF4444':t.all>effectiveIncome*.85?'#F5A623':'#4ADE80'}"></div></div>
    <div class="prog-sub">${Math.round(pct(t.all,effectiveIncome))}% of income committed · ${daysLeft} days left</div>`;
  }
  h+=`</div>`;

  // TABS
  h+=`<div class="tabs">${tabs.map(tb=>`<button class="${view===tb.id?'on':''}" onclick="go('${tb.id}')">${tb.icon} ${tb.label}</button>`).join('')}</div>`;
  h+=`<div class="content">`;


  // ── INPUT ──
  if(view==='input'){
    if(showRollover){
      h+=`<div class="insight info"><div class="i-title">📅 New month — ${monthLabel}</div><div class="i-body">Last month's budget has been archived to History. Your items have been carried forward with statuses reset to unpaid.<br/><br/>You can:<br/>• <strong>Re-paste</strong> a fresh budget below (replaces everything)<br/>• <strong>Keep the carried-forward items</strong> and adjust in Overview<br/>• <strong>Start blank</strong> if this month is different</div></div>
      <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
        <button class="btn outline sm" onclick="go('overview')">📊 Use carried-forward items</button>
        <button class="btn outline sm" onclick="clearForNew()">🗑 Start blank</button>
        <button class="btn outline sm" onclick="go('history')">📁 View last month</button>
      </div>`;
    }
    h+=`<div class="sec-title">Paste or type your budget</div>
    <div class="sec-sub">Type it how you'd write it in your notes — income, expenses, balance. Mark things as "paid", "pd", or "?" for uncertain. The parser handles the rest.</div>
    <textarea id="raw-input" rows="14" placeholder="Example:
Balance in account 45000
Income - 120,000

Rent - 35000
Groceries - 15000
Transport - 8000
WiFi - 3000 paid
Electricity - 2500
Water - 800
SACCO - 10,000 paid
Chama - 5000 paid
Airtime - 1500 pd
School fees - 12000
Savings - 15000
Gym - 3k?
Netflix - 1500 paid">${data.rawInput||''}</textarea>
    <button class="btn primary" style="margin-top:12px" onclick="parseInput()">${data.items.length>0?'Re-parse & Replace Budget':'Parse & Analyze Budget'}</button>`;
    if(data.items.length>0){
      h+=`<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
        <div style="font-size:13px;font-weight:700;color:var(--slate);margin-bottom:8px">Quick Edit Current Budget</div>
        <div style="font-size:12px;color:var(--text-light);margin-bottom:10px">Edit income, balance, or individual items without re-parsing.</div>
        <div style="display:flex;gap:8px;margin-bottom:10px">
          <div style="flex:1"><label class="fl">Income</label><input class="inp" id="qe-income" type="number" value="${data.income||''}" inputmode="numeric"/></div>
          <div style="flex:1"><label class="fl">Balance</label><input class="inp" id="qe-balance" type="number" value="${data.balance!==null?data.balance:''}" inputmode="numeric" placeholder="Optional"/></div>
        </div>`;
      data.items.forEach((item,i)=>{
        h+=`<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;padding:8px;background:#fff;border-radius:8px;border:1px solid #E5E7EB">
          <input class="inp qe-name" type="text" value="${esc(item.name)}" data-idx="${i}" style="flex:2;padding:8px;font-size:13px"/>
          <input class="inp qe-amt" type="number" value="${item.amount}" data-idx="${i}" style="width:90px;padding:8px;font-size:13px;text-align:right" inputmode="numeric"/>
          <select class="inp qe-st" data-idx="${i}" style="width:80px;padding:8px;font-size:11px">
            <option value="unpaid" ${item.status==='unpaid'?'selected':''}>Unpaid</option>
            <option value="partial" ${item.status==='partial'?'selected':''}>Partial</option>
            <option value="paid" ${item.status==='paid'?'selected':''}>Paid</option>
            <option value="maybe" ${item.status==='maybe'?'selected':''}>Maybe</option>
          </select>
          <button onclick="quickDeleteItem(${i})" style="background:none;border:none;color:#EF4444;cursor:pointer;font-size:14px;padding:4px">✕</button>
        </div>`;
      });
      h+=`<button class="btn primary" style="margin-top:10px" onclick="saveQuickEdits()">Save Changes</button>
        <button class="btn outline" style="margin-top:8px" onclick="go('overview')">View Overview →</button>
      </div>`;
    }
  }


  // ── OVERVIEW ──
  if(view==='overview'){
    // PIN setup nudge for existing users
    if(!hasPinSet() && data.items.length>0 && !localStorage.getItem('ba4-pin-dismissed')){
      h+=`<div class="insight info" style="position:relative">
        <button onclick="localStorage.setItem('ba4-pin-dismissed','1');render()" style="position:absolute;top:8px;right:10px;background:none;border:none;color:#9CA3AF;font-size:16px;cursor:pointer">✕</button>
        <div class="i-title">🔐 Protect your budget with a PIN</div>
        <div class="i-body">Your financial data is currently unprotected. Add a 4-digit PIN to encrypt everything with AES-256 — even if someone opens your browser, they can't read your data.<br/><br/>
        <button class="btn primary sm" onclick="showLockScreen('setup')" style="margin-top:4px">Set Up PIN</button>
        </div>
      </div>`;
    }
    if(!t||data.items.length===0){
      h+=`<div class="empty">No budget data yet.<br/><button class="btn primary sm" style="margin-top:12px" onclick="go('input')">✏️ Enter Budget</button></div>`;
    } else {
      const invTotal=(data.investments||[]).reduce((s,i)=>s+i.amount,0);
      h+=`<div class="a-grid">
        <div class="a-card ${t.remaining<0?'danger':t.remaining<(t.incTotal)*.1&&t.incTotal>0?'caution':'good'}"><div class="a-num">${K(t.remaining)}</div><div class="a-label">Remaining</div></div>
        <div class="a-card"><div class="a-num">${K(t.paid)}</div><div class="a-label">Paid Out</div></div>
        <div class="a-card ${t.stillDue>0?'danger':'good'}"><div class="a-num">${K(t.stillDue)}</div><div class="a-label">Still Due</div></div>
        <div class="a-card ${invTotal>0?'good':''}"><div class="a-num">${K(invTotal)}</div><div class="a-label">Invested</div></div>
      </div>`;

      if(data.balance!==null){
        h+=`<div class="insight ${data.balance<0?'warn':'info'}">
          <div class="i-title">${data.balance<0?'🔴':'💳'} Opening Balance: ${K(data.balance)}</div>
          <div class="i-body">${data.balance<0?'Starting in the red. Address the deficit before anything discretionary.':'Account balance at start of budget period.'}</div>
        </div>`;
      }

      // Savings goal progress
      if(profile.savingsGoal && profile.savingsTarget){
        const savKw=/sav|sacco|shares|invest|chama|pension|nssf|lock|mali/i;
        const savItems=data.items.filter(i=>savKw.test(i.name));
        const savTotal=savItems.reduce((s,i)=>s+i.amount,0);
        const goalHist=getHistory();
        const histSav=goalHist.reduce((s,m)=>{
          return s+m.items.filter(i=>savKw.test(i.name)&&i.status==='paid').reduce((a,i)=>a+i.amount,0);
        },0);
        const totalSaved=histSav+savTotal;
        const goalPct=Math.min(Math.round((totalSaved/profile.savingsTarget)*100),100);
        const goalColor=goalPct>=100?'var(--green)':goalPct>=50?'var(--amber)':'var(--blue)';
        let timeMsg='';
        if(profile.savingsDate){
          const target=new Date(profile.savingsDate);
          const msLeft=target-now;
          const daysToGo=Math.ceil(msLeft/(1000*60*60*24));
          const gap=profile.savingsTarget-totalSaved;
          if(daysToGo>0&&gap>0){
            const moLeft=Math.ceil(daysToGo/30);
            const perMo=Math.round(gap/moLeft);
            timeMsg=`${daysToGo} days left · Save ${K(perMo)}/month to hit target`;
          } else if(gap<=0){
            timeMsg='🎉 Target reached!';
          }
        }
        h+=`<div class="card" style="padding:16px;margin-bottom:10px;border:1px solid ${goalColor}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <div style="font-size:13px;font-weight:700;color:var(--slate)">🎯 ${esc(profile.savingsGoal)}</div>
            <div style="font-size:12px;font-weight:600;color:${goalColor}">${goalPct}%</div>
          </div>
          <div style="height:8px;background:#F3F4F6;border-radius:4px;overflow:hidden;margin-bottom:6px">
            <div style="height:100%;width:${goalPct}%;background:${goalColor};border-radius:4px;transition:width .4s"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-light)">
            <span>${K(totalSaved)} saved</span>
            <span>${K(profile.savingsTarget)} target</span>
          </div>
          ${timeMsg?`<div style="font-size:11px;color:var(--text-mid);margin-top:4px">${timeMsg}</div>`:''}
        </div>`;
      }

      // ── DRAWDOWN WATERFALL ──
      const deductions=data.items.filter(i=>i.deduction);
      const incReceived=t.incReceived||0;
      const startingFigure=incReceived>0?incReceived:t.incTotal;
      const nonDeductItems=data.items.filter(i=>!i.deduction);
      const nonDeductTotal=nonDeductItems.reduce((s,i)=>s+i.amount,0);

      if(deductions.length>0){
        // Calculate actual deducted vs pending
        const deductedActual=deductions.reduce((s,d)=>{
          if(d.status==='paid') return s+d.amount;
          if(d.status==='partial') return s+(d.paidAmount||0);
          return s;
        },0);
        const deductedPending=deductions.reduce((s,d)=>{
          if(d.status==='unpaid') return s+d.amount;
          if(d.status==='partial') return s+(d.amount-(d.paidAmount||0));
          if(d.status==='maybe') return s+d.amount;
          return s;
        },0);
        const netAfterDeducted=startingFigure-deductedActual;
        const netAfterAll=startingFigure-deductedActual-deductedPending;

        h+=`<div class="card" style="padding:16px;margin-bottom:14px;background:#FAFAF8">
          <div style="font-size:13px;font-weight:700;color:var(--slate);margin-bottom:10px">💫 Income Drawdown</div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
            <span style="font-size:13px;color:var(--green);font-weight:600">${incReceived>0&&t.incExpected>0?'Income Received':'Income'}</span>
            <span style="font-family:'DM Mono',monospace;font-size:14px;font-weight:600;color:var(--green)">${K(startingFigure)}</span>
          </div>`;

        let runningTotal=startingFigure;
        deductions.forEach(d=>{
          const actualAmt=d.status==='paid'?d.amount:d.status==='partial'?(d.paidAmount||0):0;
          const pendingAmt=d.status==='unpaid'?d.amount:d.status==='partial'?(d.amount-(d.paidAmount||0)):d.status==='maybe'?d.amount:0;

          if(actualAmt>0){
            runningTotal-=actualAmt;
            h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)">
              <span style="font-size:12px;color:var(--red)">− ${esc(d.name)} ${d.status==='paid'?'✓':'◐'}</span>
              <div style="text-align:right">
                <div style="font-family:'DM Mono',monospace;font-size:12px;color:var(--red)">−${K(actualAmt)}</div>
                <div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--text-light)">${K(runningTotal)}</div>
              </div>
            </div>`;
            if(d.status==='partial'&&pendingAmt>0){
              h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0 6px;border-bottom:1px solid var(--border);background:#FEFCE8">
                <span style="font-size:11px;color:var(--amber);padding-left:16px">↳ ${K(pendingAmt)} pending on ${esc(d.name)}</span>
                <span style="font-family:'DM Mono',monospace;font-size:10px;color:var(--amber)">still owed</span>
              </div>`;
            }
          } else {
            // Unpaid or maybe — nothing deducted yet
            h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);background:#F9FAFB">
              <span style="font-size:12px;color:var(--text-light)">− ${esc(d.name)} ${d.status==='maybe'?'?':'⏳'}</span>
              <div style="text-align:right">
                <div style="font-family:'DM Mono',monospace;font-size:12px;color:var(--text-light)">KES 0</div>
                <div style="font-size:10px;color:var(--amber)">${K(d.amount)} upcoming</div>
              </div>
            </div>`;
          }
        });

        h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;margin-top:4px">
            <span style="font-size:14px;font-weight:700;color:var(--slate)">Available Now</span>
            <span style="font-family:'DM Mono',monospace;font-size:16px;font-weight:700;color:${netAfterDeducted<0?'var(--red)':'var(--green)'}">${K(netAfterDeducted)}</span>
          </div>`;

        if(deductedPending>0){
          h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px dashed var(--amber)">
            <span style="font-size:12px;color:var(--amber);font-weight:600">Pending deductions</span>
            <span style="font-family:'DM Mono',monospace;font-size:12px;color:var(--amber)">−${K(deductedPending)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0">
            <span style="font-size:12px;color:var(--text-light)">After pending deductions</span>
            <span style="font-family:'DM Mono',monospace;font-size:12px;color:${netAfterAll<0?'var(--red)':'var(--text-mid)'}">${K(netAfterAll)}</span>
          </div>`;
        }

        if(nonDeductTotal>0){
          h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px dashed var(--border)">
            <span style="font-size:12px;color:var(--text-light)">Other expenses (${nonDeductItems.length} items)</span>
            <span style="font-family:'DM Mono',monospace;font-size:12px;color:var(--text-mid)">−${K(nonDeductTotal)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0">
            <span style="font-size:13px;font-weight:600;color:var(--slate)">After everything</span>
            <span style="font-family:'DM Mono',monospace;font-size:14px;font-weight:700;color:${netAfterDeducted-nonDeductTotal<0?'var(--red)':'var(--green)'}">${K(netAfterDeducted-nonDeductTotal)}</span>
          </div>`;
        }
        if(t.incExpected>0){
          h+=`<div style="font-size:11px;color:var(--blue);margin-top:6px;padding-top:6px;border-top:1px solid var(--border)">⏳ ${K(t.incExpected)} income still pending — not included above</div>`;
        }
        h+=`</div>`;
        h+=`<div style="font-size:11px;color:var(--text-light);margin-bottom:12px;text-align:center">Tap ★ on any expense to mark it as an income deduction</div>`;
      }

      h+=`<table class="b-table"><thead><tr><th></th><th>Item</th><th style="text-align:right">Amount</th><th style="text-align:center">Status</th><th></th></tr></thead><tbody>`;
      data.items.forEach(i=>{
        const isPartial=i.status==='partial';
        const paidAmt=i.paidAmount||0;
        const owing=i.amount-paidAmt;
        const pctPaid=isPartial?Math.round((paidAmt/i.amount)*100):0;
        const stColor=i.status==='paid'?'var(--green)':i.status==='unpaid'?'var(--red)':isPartial?'var(--amber)':'#92400E';
        const isDed=i.deduction;

        h+=`<tr style="${isDed?'background:#FFF8F0;':''}">
          <td style="width:28px;padding:6px 2px">
            <button onclick="toggleDeduction('${i.id}')" style="background:none;border:none;cursor:pointer;font-size:16px;padding:0;line-height:1" title="${isDed?'Remove deduction':'Mark as income deduction'}">${isDed?'★':'☆'}</button>
          </td>
          <td>
            ${isDed?'<span style="font-size:9px;background:var(--amber-soft);color:#92400E;padding:1px 5px;border-radius:3px;font-weight:600;vertical-align:middle;margin-right:4px">DEDUCTION</span>':''}${esc(i.name)}
            ${isPartial?`<div style="margin-top:4px">
              <div style="height:4px;background:#F3F4F6;border-radius:2px;overflow:hidden;width:80px">
                <div style="height:100%;width:${pctPaid}%;background:var(--amber);border-radius:2px"></div>
              </div>
              <div style="font-size:10px;color:var(--text-light);margin-top:2px">${K(paidAmt)} paid · ${K(owing)} left</div>
            </div>`:''}
          </td>
          <td class="amt"><input type="number" value="${i.amount}" onchange="editAmt('${i.id}',this.value)" style="width:85px;border:1px solid transparent;background:none;font-family:'DM Mono',monospace;font-size:13px;font-weight:500;text-align:right;padding:4px 6px;border-radius:4px;outline:none" onfocus="this.style.borderColor='var(--blue)';this.style.background='#fff'" onblur="this.style.borderColor='transparent';this.style.background='none'" inputmode="numeric"/></td>
          <td class="status">
            <select onchange="setSt('${i.id}',this.value)" style="border:none;background:none;font-size:11px;font-weight:700;cursor:pointer;color:${stColor}">
              <option value="paid" ${i.status==='paid'?'selected':''}>✓ Paid</option>
              <option value="partial" ${i.status==='partial'?'selected':''}>◐ Partial</option>
              <option value="unpaid" ${i.status==='unpaid'?'selected':''}>✗ Unpaid</option>
              <option value="maybe" ${i.status==='maybe'?'selected':''}>? Maybe</option>
            </select>
          </td>
          <td><button class="del" onclick="delIt('${i.id}')">✕</button></td>
        </tr>`;
        if(isPartial){
          h+=`<tr><td></td><td colspan="4" style="padding:4px 8px 10px;border-bottom:1px solid var(--border)">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:11px;color:var(--text-light);white-space:nowrap">Amount paid:</span>
              <input type="number" value="${paidAmt}" onchange="setPaidAmt('${i.id}',this.value)" style="width:100px;padding:6px 8px;border:1px solid #D1D5DB;border-radius:6px;font-size:13px;font-family:'DM Mono',monospace;text-align:right" inputmode="numeric"/>
              <span style="font-size:11px;color:var(--text-light)">of ${K(i.amount)}</span>
            </div>
          </td></tr>`;
        }
      });
      h+=`<tr class="b-total"><td></td><td>Total Expenses</td><td class="amt">${K(t.all)}</td><td></td><td></td></tr></tbody></table>`;

      // ── INCOME SUMMARY IN OVERVIEW ──
      const incSrcs=data.incomeSources||[];
      if(incSrcs.length>0){
        h+=`<div style="margin-top:20px;padding-top:16px;border-top:2px solid var(--border)">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <div style="font-size:14px;font-weight:700;color:var(--slate)">💵 Income</div>
            <button class="btn outline sm" style="font-size:11px;padding:6px 12px" onclick="go('income')">Manage →</button>
          </div>`;
        const rcv=incSrcs.filter(s=>s.status==='received').reduce((s,i)=>s+i.amount,0);
        const pnd=incSrcs.filter(s=>s.status==='pending').reduce((s,i)=>s+i.amount,0);

      h+=`<div class="card" style="padding:16px;margin-bottom:14px;border:2px solid var(--amber)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <div style="font-size:14px;font-weight:700;color:var(--slate)">Estimated monthly impact</div>
          <div style="font-family:'DM Mono',monospace;font-size:18px;font-weight:700;color:var(--amber)">up to ${K(myTotal)}</div>
        </div>
        <div style="font-size:12px;color:var(--text-light)">That's up to ${K(myTotal*12)}/year if all apply at full estimate · Your actual amounts may differ</div>
      </div>`;

      mine.forEach(l=>{
        h+=`<div class="leak"><div class="leak-hd"><span class="leak-nm">${l.name}</span><span class="leak-cost">up to ~${K(l.mo)}/mo</span></div><div class="leak-tip">${l.tip}</div></div>`;
      });

      h+=`<div class="insight tip"><div class="i-title">💡 These are estimates, not facts</div><div class="i-body">The amounts above are common ranges — yours could be higher or lower. The point is to make you aware of spending that often flies under the radar. Track these for a week to find your real numbers. Update your selections in <span style="color:var(--blue);cursor:pointer;text-decoration:underline" onclick="go('settings')">Settings</span>.</div></div>`;

    } else {
      // No selections — self-assessment checklist
      h+=`<div class="sec-sub">Small recurring costs can quietly add up. Go through this list and check any that apply to <em>your</em> spending. Not all of these will be relevant to you — that's fine.</div>`;

      LEAKS.forEach(l=>{
        h+=`<label class="leak" style="display:flex;gap:12px;align-items:flex-start;cursor:pointer">
          <input type="checkbox" class="hid-chk" value="${l.id}" onchange="updateHiddenTotal()" style="width:20px;height:20px;accent-color:var(--green);margin-top:2px;flex-shrink:0"/>
          <div style="flex:1">
            <div class="leak-hd"><span class="leak-nm">Do you spend on ${l.name.toLowerCase()}?</span><span class="leak-cost">could be ~${K(l.mo)}/mo</span></div>
            <div class="leak-tip"><strong>If yes:</strong> ${l.tip}</div>
          </div>
        </label>`;
      });

      h+=`<div id="hid-total" style="margin-top:12px"></div>`;
      h+=`<button class="btn primary" style="margin-top:12px;display:none" id="hid-save-btn" onclick="saveHiddenSelections()">Save My Selections</button>`;
      h+=`<div style="font-size:12px;color:var(--text-light);margin-top:8px;text-align:center">Only checked items will show in your profile. Amounts are estimates based on common spending patterns.</div>`;
    }

    // Reset selections link if they have saved ones
    if(hasSelections){
      h+=`<button class="btn outline" style="margin-top:12px" onclick="clearHiddenSelections()">🔄 Redo Check-Up</button>`;
    }

    // ── CUSTOM CHECK-UP ITEMS ──
    const customLeaks=profile.customLeaks||[];
    const freqLabels={daily:'Daily',weekly:'Weekly',biweekly:'Every 2 weeks',monthly:'Monthly',quarterly:'Quarterly',yearly:'Yearly',onetime:'One-time'};

    h+=`<div style="margin-top:24px;padding-top:20px;border-top:2px solid var(--border)">
      <div style="font-size:14px;font-weight:700;color:var(--slate);margin-bottom:4px">Your Custom Expenses</div>
      <div style="font-size:12px;color:var(--text-light);margin-bottom:12px">Track spending that's unique to you — parking, takeaway, church offering, loan repayments, whatever applies.</div>`;

    if(customLeaks.length>0){
      let customMonthly=0;
      customLeaks.forEach((cl,idx)=>{
        const mo=toMonthly(cl.amount,cl.frequency);
        customMonthly+=mo;
        const freqBadge=freqLabels[cl.frequency]||cl.frequency;
        h+=`<div class="card" style="padding:12px;margin-bottom:6px;border-left:3px solid var(--amber)">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div style="flex:1">
              <div style="font-size:13px;font-weight:600;color:var(--slate)">${esc(cl.name)}</div>
              ${cl.note?`<div style="font-size:11px;color:var(--text-light);margin-top:2px">${esc(cl.note)}</div>`:''}
              <div style="font-size:11px;color:var(--text-mid);margin-top:3px">
                <span style="background:var(--amber-soft);padding:2px 6px;border-radius:4px;font-weight:600;font-size:10px;color:#92400E">${freqBadge}</span>
                <span style="margin-left:6px">${K(cl.amount)} × ${freqToLabel(cl.frequency)}</span>
              </div>
            </div>
            <div style="text-align:right">
              <div style="font-family:'DM Mono',monospace;font-size:14px;font-weight:600;color:var(--amber)">${K(mo)}<span style="font-size:10px;font-weight:400;color:var(--text-light)">/mo</span></div>
              <button onclick="delCustomLeak(${idx})" style="background:none;border:none;color:#9CA3AF;cursor:pointer;font-size:12px;margin-top:4px">remove</button>
            </div>
          </div>
        </div>`;
      });

      h+=`<div class="card" style="padding:14px;margin-top:8px;border:2px solid var(--amber);background:var(--amber-soft)">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-size:13px;font-weight:700;color:#92400E">Your custom expenses total</div>
            <div style="font-size:11px;color:#92400E;margin-top:2px">${customLeaks.length} item${customLeaks.length>1?'s':''} · ${K(customMonthly*12)}/year</div>
          </div>
          <div style="font-family:'DM Mono',monospace;font-size:20px;font-weight:700;color:#92400E">${K(customMonthly)}<span style="font-size:11px;font-weight:400">/mo</span></div>
        </div>
      </div>`;

      // Combined total with pre-set selections
      const presetTotal=myLeaks.reduce((s,id)=>{const l=LEAKS.find(x=>x.id===id);return s+(l?l.mo:0);},0);
      if(presetTotal>0){
        const grandTotal=presetTotal+customMonthly;
        h+=`<div class="insight warn" style="margin-top:12px"><div class="i-title">🧮 Combined hidden drain: up to ${K(grandTotal)}/month</div><div class="i-body">Pre-set items (~${K(presetTotal)}) + your custom items (${K(customMonthly)}) = up to <strong>${K(grandTotal*12)}/year</strong>. Even cutting 30% saves ${K(Math.round(grandTotal*.3))}/month.</div></div>`;
      }
    }

    // Add custom item form
    h+=`<div style="margin-top:14px;padding:14px;background:#fff;border-radius:10px;border:1px solid var(--border)">
      <div style="font-size:12px;font-weight:600;color:var(--slate);margin-bottom:8px">Add a custom expense</div>
      <input class="inp" type="text" id="cl-name" placeholder="What do you spend on? (e.g. Parking)" style="margin-bottom:6px"/>
      <input class="inp" type="text" id="cl-note" placeholder="Note (optional — e.g. CBD parking Mon-Fri)" style="margin-bottom:6px"/>
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <input class="inp" type="number" id="cl-amt" placeholder="Amount" inputmode="numeric" style="flex:1"/>
        <select class="inp" id="cl-freq" style="flex:1">
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="biweekly">Every 2 weeks</option>
          <option value="monthly" selected>Monthly</option>
          <option value="quarterly">Quarterly</option>
          <option value="yearly">Yearly</option>
          <option value="onetime">One-time</option>
        </select>
      </div>
      <div id="cl-preview" style="margin-bottom:8px"></div>
      <button class="btn primary" onclick="addCustomLeak()">Add to Check-Up</button>
    </div></div>`;
  }


  // ── MPESA LOCK ──
  if(view==='mpesa'){
    h+=`<div class="sec-title">M-Pesa Lock Savings Guide</div><div class="sec-sub">Make your savings physically unavailable. Willpower is a limited resource.</div>`;
    MPESA.forEach(tip=>{
      h+=`<div class="mpesa-card"><h3>${tip.title}</h3>`;
      tip.steps.forEach((s,i)=>{h+=`<div class="mpesa-step"><span class="n">${i+1}.</span><span>${s}</span></div>`});
      h+=`</div>`;
    });
    h+=`<div class="insight ok"><div class="i-title">🔑 The core principle</div><div class="i-body">Lock savings on payday. Reduce Fuliza. Leave only the week's budget on M-Pesa. Make the right choice the <em>only</em> choice.</div></div>`;
  }


  // ── HISTORY ──
  if(view==='history'){
    h+=`<div class="sec-title">Budget History</div><div class="sec-sub">Past months are archived automatically when a new month begins. You can also snapshot the current month manually.</div>`;

    // Manual archive button
    if(data.items.length>0){
      h+=`<div class="card" style="padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;border:1px dashed var(--blue)">
        <div style="font-size:24px">📸</div>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:600;color:var(--slate)">Snapshot ${monthLabel}</div>
          <div style="font-size:12px;color:var(--text-light)">Save a copy of this month's budget to history. Your current data stays as-is.</div>
        </div>
        <button class="btn primary sm" style="white-space:nowrap" onclick="manualArchive()">Save</button>
      </div>`;
    }

    // Import from CSV export
    h+=`<div class="card" style="padding:14px;margin-bottom:16px;border:1px dashed var(--amber)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <div style="font-size:20px">📥</div>
        <div>
          <div style="font-size:13px;font-weight:600;color:var(--slate)">Import from previous export</div>
          <div style="font-size:12px;color:var(--text-light)">Paste a CSV or clipboard export to recover a past month's data into history.</div>
        </div>
      </div>
      <div id="import-area" style="display:none">
        <div class="fg"><label class="fl">Paste your exported data</label>
          <textarea class="inp" id="import-csv" rows="8" placeholder="Paste your CSV or clipboard export here...&#10;&#10;The month will be detected automatically from the header line (e.g. 'Track my Chumz — June 2026')." oninput="detectImportMonth()"></textarea>
        </div>
        <div id="import-month-row" style="display:none">
          <div class="fg"><label class="fl">Month detected (edit if wrong)</label>
            <input class="inp" type="month" id="import-month" value="${curMonth}"/>
          </div>
        </div>
        <div id="import-preview"></div>
        <button class="btn primary" onclick="importCSV()">Import to History</button>
        <button class="btn outline" style="margin-top:6px" onclick="$('#import-area').style.display='none';$('#import-toggle-btn').style.display='block'">Cancel</button>
      </div>
      <button class="btn outline sm" id="import-toggle-btn" onclick="$('#import-area').style.display='block';this.style.display='none'">Paste Export Data</button>
    </div>`;

    if(hist.length===0){
      h+=`<div class="empty">No history yet.${data.items.length>0?' Tap the snapshot button above to save this month\'s data.':' Enter a budget first, then come back to archive it.'}</div>`;
    } else {

      // ════════════════════════════════════
      // YEAR-IN-REVIEW SUMMARY
      // ════════════════════════════════════
      const years={};
      hist.forEach(m=>{
        const y=m.month.split('-')[0];
        if(!years[y]) years[y]={months:[],totIncome:0,totExpenses:0,totPaid:0,totRemaining:0,totInvested:0};
        years[y].months.push(m);
        years[y].totIncome+=m.income;
        years[y].totExpenses+=m.totalExpenses;
        years[y].totPaid+=m.totalPaid;
        years[y].totRemaining+=m.remaining;
        years[y].totInvested+=(m.totalInvested||0);
      });

      Object.keys(years).sort().reverse().forEach(yr=>{
        const y=years[yr];
        const avgExp=Math.round(y.totExpenses/y.months.length);
        const avgInc=Math.round(y.totIncome/y.months.length);
        const savRate=y.totIncome>0?Math.round(((y.totIncome-y.totExpenses)/y.totIncome)*100):0;
        const bestMonth=y.months.reduce((a,b)=>a.remaining>b.remaining?a:b);
        const worstMonth=y.months.reduce((a,b)=>a.remaining<b.remaining?a:b);
        const maxBar=Math.max(...y.months.map(m=>m.totalExpenses),1);

        // Detect recurring items across months
        const itemFreq={};
        y.months.forEach(m=>{
          const seen=new Set();
          m.items.forEach(i=>{
            const key=i.name.toLowerCase().trim();
            if(!seen.has(key)){seen.add(key);itemFreq[key]=(itemFreq[key]||{name:i.name,count:0,total:0});itemFreq[key].count++;itemFreq[key].total+=i.amount;}
          });
        });
        const recurring=Object.values(itemFreq).filter(i=>i.count>=Math.max(2,Math.floor(y.months.length*.5))).sort((a,b)=>b.total-a.total);

        h+=`<div class="card" style="margin-bottom:16px;padding:20px;border:2px solid var(--slate)">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
            <div style="font-size:20px">📊</div>
            <div>
              <div style="font-size:18px;font-weight:700;color:var(--slate)">${yr} Year in Review</div>
              <div style="font-size:12px;color:var(--text-light)">${y.months.length} month${y.months.length>1?'s':''} tracked</div>
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
            <div style="background:var(--off-white);border-radius:8px;padding:12px;text-align:center">
              <div style="font-family:'DM Mono',monospace;font-size:16px;font-weight:700;color:var(--slate)">${K(y.totIncome)}</div>
              <div style="font-size:11px;color:var(--text-light);margin-top:2px">Total Income</div>
            </div>
            <div style="background:var(--off-white);border-radius:8px;padding:12px;text-align:center">
              <div style="font-family:'DM Mono',monospace;font-size:16px;font-weight:700;color:${y.totExpenses>y.totIncome?'var(--red)':'var(--slate)'}">${K(y.totExpenses)}</div>
              <div style="font-size:11px;color:var(--text-light);margin-top:2px">Total Expenses</div>
            </div>
            <div style="background:var(--green-soft);border-radius:8px;padding:12px;text-align:center">
              <div style="font-family:'DM Mono',monospace;font-size:16px;font-weight:700;color:var(--green)">${K(y.totInvested)}</div>
              <div style="font-size:11px;color:var(--green);margin-top:2px">Total Invested</div>
            </div>
            <div style="background:var(--off-white);border-radius:8px;padding:12px;text-align:center">
              <div style="font-family:'DM Mono',monospace;font-size:16px;font-weight:700;color:${savRate>=20?'var(--green)':savRate>=10?'var(--amber)':'var(--red)'}">${savRate}%</div>
              <div style="font-size:11px;color:var(--text-light);margin-top:2px">Savings Rate</div>
            </div>
          </div>

          <div style="font-size:12px;font-weight:700;color:var(--slate);margin-bottom:8px">Monthly Expense Trend</div>
          <div style="margin-bottom:16px">`;

        // Visual bar chart for each month
        y.months.forEach(m=>{
          const barW=Math.round((m.totalExpenses/maxBar)*100);
          const barColor=m.remaining<0?'var(--red)':m.totalExpenses>m.income*.85?'var(--amber)':'var(--green)';
          const moShort=monthLabel2(m.month).split(' ')[0].slice(0,3);
          h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <div style="width:32px;font-size:11px;color:var(--text-light);text-align:right;font-family:'DM Mono',monospace">${moShort}</div>
            <div style="flex:1;height:14px;background:#F3F4F6;border-radius:3px;overflow:hidden;position:relative">
              <div style="height:100%;width:${barW}%;background:${barColor};border-radius:3px;transition:width .3s"></div>
            </div>
            <div style="width:80px;font-size:11px;color:var(--text-mid);text-align:right;font-family:'DM Mono',monospace">${K(m.totalExpenses)}</div>
          </div>`;
        });

        h+=`</div>`;

        // Best & worst months
        h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
          <div style="background:var(--green-soft);border-radius:8px;padding:10px">
            <div style="font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.5px">Best Month</div>
            <div style="font-size:13px;font-weight:600;color:var(--slate);margin-top:4px">${monthLabel2(bestMonth.month)}</div>
            <div style="font-size:12px;color:var(--text-mid)">${K(bestMonth.remaining)} remaining</div>
          </div>
          <div style="background:var(--red-soft);border-radius:8px;padding:10px">
            <div style="font-size:11px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.5px">Tightest Month</div>
            <div style="font-size:13px;font-weight:600;color:var(--slate);margin-top:4px">${monthLabel2(worstMonth.month)}</div>
            <div style="font-size:12px;color:var(--text-mid)">${K(worstMonth.remaining)} remaining</div>
          </div>
        </div>`;

        // Recurring items
        if(recurring.length>0){
          h+=`<div style="font-size:12px;font-weight:700;color:var(--slate);margin-bottom:6px">🔁 Recurring Expenses (${Math.floor(y.months.length*.5)}+ months)</div>
          <table class="b-table" style="font-size:12px;margin-bottom:12px">
            <thead><tr><th>Item</th><th style="text-align:right">Avg/Month</th><th style="text-align:right">Year Total</th><th style="text-align:center">Months</th></tr></thead><tbody>`;
          recurring.forEach(r=>{
            h+=`<tr><td>${esc(r.name)}</td><td class="amt">${K(Math.round(r.total/r.count))}</td><td class="amt">${K(r.total)}</td><td style="text-align:center">${r.count}/${y.months.length}</td></tr>`;
          });
          h+=`</tbody></table>`;
        }

        // Year verdict
        const verdict = savRate >= 20 ? {icon:'🏆',type:'ok',title:'Strong year',body:`${savRate}% savings rate is excellent. You kept ${K(y.totRemaining)} of your income. Keep this structure locked in.`}
          : savRate >= 10 ? {icon:'👍',type:'tip',title:'Decent year, room to grow',body:`${savRate}% savings rate is a start, but aim for 20%+. That would mean saving an extra ${K(Math.round((y.totIncome*.2)-(y.totIncome-y.totExpenses)))} across the year.`}
          : savRate >= 0 ? {icon:'⚠️',type:'warn',title:'Cutting it close',body:`Only ${savRate}% saved. You earned ${K(y.totIncome)} and spent ${K(y.totExpenses)} — just ${K(y.totRemaining)} left. Look at the recurring items above for where to cut.`}
          : {icon:'🚨',type:'warn',title:'Spent more than earned',body:`You spent ${K(Math.abs(y.totRemaining))} more than you earned. This isn't sustainable. The recurring items above show where the money is going — cut the ones that aren't essential.`};

        h+=`<div class="insight ${verdict.type}"><div class="i-title">${verdict.icon} ${verdict.title}</div><div class="i-body">${verdict.body}</div></div>`;
        h+=`</div>`; // close year card
      });


      // ════════════════════════════════════
      // MONTHLY ARCHIVE CARDS
      // ════════════════════════════════════
      h+=`<div style="font-size:15px;font-weight:700;color:var(--slate);margin:20px 0 12px">Monthly Archive</div>`;

      [...hist].reverse().forEach(m=>{
        const pctUsed=m.income>0?Math.round((m.totalExpenses/m.income)*100):0;
        const color=m.remaining<0?'var(--red)':m.remaining<m.income*.1?'var(--amber)':'var(--green)';
        const hasIncSrcs=m.incomeSources&&m.incomeSources.length>0;
        const incRcvd=m.incomeReceived||m.income;
        const incPend=m.incomePending||0;

        h+=`<div class="card" style="margin-bottom:12px;padding:16px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div style="font-size:15px;font-weight:700;color:var(--slate)">${monthLabel2(m.month)}</div>
            <div style="font-size:12px;font-weight:600;color:${color}">${m.remaining>=0?'+':''}${K(m.remaining)}</div>
          </div>
          <div style="display:flex;gap:12px;font-size:12px;color:var(--text-mid);margin-bottom:10px;flex-wrap:wrap">
            <div><span style="color:var(--text-light)">Income</span> <strong>${K(m.income)}</strong></div>
            <div><span style="color:var(--text-light)">Expenses</span> <strong>${K(m.totalExpenses)}</strong></div>
            <div><span style="color:var(--text-light)">Paid</span> <strong style="color:var(--green)">${K(m.totalPaid)}</strong></div>
          </div>
          ${hasIncSrcs&&incPend>0?`<div style="display:flex;gap:8px;margin-bottom:8px;font-size:11px">
            <span style="color:var(--green)">✓ Received: ${K(incRcvd)}</span>
            <span style="color:var(--blue)">⏳ Pending: ${K(incPend)}</span>
          </div>`:''}
          <div style="height:5px;background:#F3F4F6;border-radius:3px;overflow:hidden;margin-bottom:6px">
            <div style="height:100%;width:${Math.min(pctUsed,100)}%;background:${color};border-radius:3px"></div>
          </div>
          <div style="font-size:11px;color:var(--text-light)">${pctUsed}% of income used</div>`;

        // Income sources detail
        if(hasIncSrcs){
          h+=`<details style="margin-top:10px"><summary style="font-size:12px;color:var(--green);cursor:pointer;font-weight:600">💵 ${m.incomeSources.length} income source${m.incomeSources.length>1?'s':''}</summary>
            <table class="b-table" style="margin-top:8px;font-size:12px">
              <thead><tr><th>Source</th><th style="text-align:right">Amount</th><th style="text-align:center">Status</th></tr></thead><tbody>`;
          m.incomeSources.forEach(s=>{
            const clr=s.status==='received'?'var(--green)':s.status==='pending'?'var(--blue)':'var(--amber)';
            const label=s.status==='received'?'✓ Received':s.status==='pending'?'⏳ Pending':`◐ ${K(s.receivedAmount||0)} rcvd`;
            h+=`<tr><td>${esc(s.name)}${s.description?`<div style="font-size:10px;color:var(--text-light)">${esc(s.description)}</div>`:''}</td><td class="amt">${K(s.amount)}</td>
              <td style="text-align:center;font-size:11px;font-weight:600;color:${clr}">${label}</td></tr>`;
          });
          h+=`</tbody></table></details>`;
        }

        // Expense items
        h+=`<details style="margin-top:8px"><summary style="font-size:12px;color:var(--blue);cursor:pointer;font-weight:600">📋 ${m.itemCount} expense${m.itemCount>1?'s':''}</summary>
          <table class="b-table" style="margin-top:8px;font-size:12px">
            <thead><tr><th>Item</th><th style="text-align:right">Amount</th><th style="text-align:center">Status</th></tr></thead><tbody>`;

// Frequency helpers
function toMonthly(amount,freq){
  const n=Number(amount)||0;
  switch(freq){
    case 'daily':return Math.round(n*30);
    case 'weekly':return Math.round(n*4.33);
    case 'biweekly':return Math.round(n*2.17);
    case 'monthly':return n;
    case 'quarterly':return Math.round(n/3);
    case 'yearly':return Math.round(n/12);
    case 'onetime':return 0; // one-time doesn't recur
    default:return n;
  }
}
function freqToLabel(freq){
  switch(freq){
    case 'daily':return '~30 days';
    case 'weekly':return '~4.3 weeks';
    case 'biweekly':return '~2.2 times';
    case 'monthly':return 'per month';
    case 'quarterly':return '÷ 3 months';
    case 'yearly':return '÷ 12 months';
    case 'onetime':return 'once';
    default:return '';
  }
}

window.manualArchive=function(){
  if(data.items.length===0){toast('No budget data to archive');return;}
  const hist=getHistory();
  const already=hist.find(h=>h.month===data.month);
  if(already){
    if(!confirm(`${monthLabel} is already in history. Save another snapshot? This will add a duplicate.`)) return;
  }
  archiveMonth(data);
  toast(`${monthLabel} saved to history`);
  track('manual_archive');
  render();
};

window.restoreBackup=function(){
  const backup=localStorage.getItem('ba4-backup');
  if(!backup){toast('No backup found');return;}
  try{
    const parsed=JSON.parse(backup);
    const itemCount=parsed.items?parsed.items.length:0;
    const month=parsed.month||'unknown';
    if(!confirm(`Found backup from ${month} with ${itemCount} items. Restore it? Your current data will be replaced.`)) return;
    localStorage.setItem('ba4',backup);
    data=parsed;
    if(!data.incomeSources) data.incomeSources=[];
    if(!data.investments) data.investments=[];
    if(!data.history) data.history=[];
    save();
    toast(`Restored backup from ${month}`);
    view='overview';
    render();
  }catch(e){
    toast('Backup is corrupted or encrypted — cannot restore');
  }
};

window.detectImportMonth=function(){
  const raw=$('#import-csv').value;
  const monthRow=$('#import-month-row');
  const monthInput=$('#import-month');
  if(!raw){monthRow.style.display='none';return;}

  // Try to detect month from header like "Track my Chumz — June 2026" or "Budget Agent — July 2026"
  const monthNames=['january','february','march','april','may','june','july','august','september','october','november','december'];
  const lines=raw.split('\n');
  let detected=null;

  for(let i=0;i<Math.min(lines.length,5);i++){
    const line=lines[i].toLowerCase();
    for(let m=0;m<monthNames.length;m++){
      if(line.includes(monthNames[m])){
        const yearMatch=line.match(/20\d{2}/);
        if(yearMatch){
          const yr=yearMatch[0];
          const mo=String(m+1).padStart(2,'0');
          detected=`${yr}-${mo}`;
          break;
        }
      }
    }
    if(detected) break;
  }

  if(detected){
    monthInput.value=detected;
    const label=new Date(detected+'-01').toLocaleDateString('en-KE',{month:'long',year:'numeric'});
    monthRow.style.display='block';
    $('#import-preview').innerHTML=`<div class="insight ok" style="margin-bottom:10px"><div class="i-title">📅 Detected: ${label}</div><div class="i-body">Month was auto-detected from the header. Edit above if it's wrong.</div></div>`;
  } else {
    monthRow.style.display='block';
    $('#import-preview').innerHTML=`<div class="insight tip" style="margin-bottom:10px"><div class="i-title">📅 Couldn't detect month</div><div class="i-body">Select the month manually above.</div></div>`;
  }
};

window.importCSV=function(){
  const raw=$('#import-csv').value.trim();
  const month=$('#import-month').value;
  if(!raw){toast('Paste your export data first');return;}
  if(!month){toast('Select which month this is from');return;}

  // Parse CSV or TSV
  const sep=raw.includes('\t')?'\t':',';
  const lines=raw.split('\n').map(l=>l.trim()).filter(l=>l);

  let section='';
  let income=0;
  let incomeSources=[];
  let items=[];
  let investments=[];
  let totalExpenses=0;
  let totalPaid=0;

  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    const upper=line.toUpperCase();

    // Detect sections
    if(upper.startsWith('INCOME')){section='income';continue;}
    if(upper.startsWith('EXPENSE')){section='expenses';continue;}
    if(upper.startsWith('SUMMARY')){section='summary';continue;}
    if(upper.startsWith('INVESTMENT')){section='investments';continue;}

    // Skip headers
    if(upper.includes('SOURCE,')&&section==='income') continue;
    if(upper.includes('SOURCE\T')&&section==='income') continue;
    if(upper.includes('ITEM,')&&section==='expenses') continue;
    if(upper.includes('ITEM\T')&&section==='expenses') continue;
    if(upper.includes('NAME,')&&section==='investments') continue;
    if(upper.includes('NAME\T')&&section==='investments') continue;
    if(upper.startsWith('TRACK MY')) continue;

    // Parse fields - handle quoted CSV
    let fields;
    if(sep===','){
      fields=[];
      let current='';
      let inQuote=false;
      for(let c=0;c<line.length;c++){
        if(line[c]==='"'){inQuote=!inQuote;continue;}
        if(line[c]===','&&!inQuote){fields.push(current.trim());current='';continue;}
        current+=line[c];
      }
      fields.push(current.trim());
    } else {
      fields=line.split('\t').map(f=>f.trim());
    }

    if(fields.length<2) continue;

    const name=fields[0].replace(/^["']|["']$/g,'');
    const amt=Number(String(fields[1]).replace(/[^0-9.-]/g,''))||0;

    if(!name||upper.startsWith('TOTAL')||!amt) {
      // Check summary lines
      if(section==='summary'){
        if(upper.includes('INCOME')) income=income||amt;
        if(upper.includes('PAID')) totalPaid=amt;
        if(upper.includes('EXPENSE')) totalExpenses=amt;
      }
      if(upper.startsWith('TOTAL INCOME')) income=amt;
      continue;
    }

    if(section==='income'){
      const status=fields[2]||'received';
      const rcvd=Number(String(fields[3]).replace(/[^0-9.-]/g,''))||0;
      const desc=fields[5]||'';
      incomeSources.push({name,description:desc,amount:amt,status:status.toLowerCase(),receivedAmount:rcvd||amt});
      income+=amt;
    }

    if(section==='expenses'){
      const status=fields[2]||'unpaid';
      const paidAmt=Number(String(fields[3]).replace(/[^0-9.-]/g,''))||0;
      items.push({name,amount:amt,status:status.toLowerCase(),paidAmount:paidAmt||null});
    }

    if(section==='investments'){
      const type=fields[2]||'other';
      const date=fields[3]||'';
      const note=fields[4]||'';
      investments.push({name,amount:amt,type,date,note});
    }
  }

  if(items.length===0&&incomeSources.length===0){
    toast('Could not parse any items — check the format');
    return;
  }

  // If no income from sources, try summary
  if(incomeSources.length===0&&income===0){
    // Try to find income from flat text
    lines.forEach(l=>{
      const m=l.match(/income[,\t]\s*(\d[\d,]*)/i);
      if(m) income=Number(m[1].replace(/,/g,''))||0;
    });
  }
  if(incomeSources.length>0) income=incomeSources.reduce((s,i)=>s+i.amount,0);
  if(!totalExpenses) totalExpenses=items.reduce((s,i)=>s+i.amount,0);
  if(!totalPaid) totalPaid=items.filter(i=>i.status==='paid').reduce((s,i)=>s+i.amount,0)
    +items.filter(i=>i.status==='partial').reduce((s,i)=>s+(i.paidAmount||0),0);

  const record={
    month:month,
    income:income,
    incomeReceived:incomeSources.filter(s=>s.status==='received').reduce((s,i)=>s+i.amount,0),
    incomePending:incomeSources.filter(s=>s.status==='pending').reduce((s,i)=>s+i.amount,0),
    balance:null,
    totalExpenses:totalExpenses,
    totalPaid:totalPaid,
    remaining:income-totalExpenses,
    itemCount:items.length,
    items:items.map(i=>({name:i.name,amount:i.amount,status:i.status,paidAmount:i.paidAmount})),
    incomeSources:incomeSources,
    investments:investments,
    totalInvested:investments.reduce((s,i)=>s+i.amount,0),
    archivedAt:new Date().toISOString(),
    importedFrom:'csv'
  };

  // Show preview
  const ml=monthLabel2(month);
  if(!confirm(`Import ${ml}?\n\n• ${items.length} expenses totaling ${K(totalExpenses)}\n• ${incomeSources.length} income sources totaling ${K(income)}\n• ${investments.length} investments\n• Remaining: ${K(income-totalExpenses)}\n\nAdd to history?`)) return;

  let hist=getHistory();
  hist.push(record);
  hist.sort((a,b)=>a.month.localeCompare(b.month));
  setHistory(hist);

  toast(`${ml} imported — ${items.length} items`);
  track('csv_imported',{items:items.length,month});
  render();
};

window.saveSettings=function(){
  const leaks=[];
  document.querySelectorAll('.pf-leak:checked').forEach(el=>leaks.push(el.value));
  const p={
    name:($('#pf-name')?.value||'').trim(),
    payday:Number($('#pf-payday')?.value)||null,
    currency:$('#pf-currency')?.value||'KES',
    savingsGoal:($('#pf-goal')?.value||'').trim(),
    savingsTarget:Number($('#pf-goal-amt')?.value)||null,
    savingsDate:$('#pf-goal-date')?.value||null,
    myLeaks:leaks,
  };
  saveProfile(p);
  toast('Settings saved');
  track('settings_saved',{has_name:!!p.name,has_goal:!!p.savingsGoal,leaks_count:leaks.length});
  render();
};
